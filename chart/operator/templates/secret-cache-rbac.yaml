{{/*
  Opt-in RBAC for a scoped Secrets cache (secretCache.namespaces).

  When secretCache.namespaces is set, the operator restricts its Secrets
  informer to those namespaces (k8sgpt-ai/k8sgpt-operator#876). The operator
  ServiceAccount then needs secrets get/list/watch in exactly those
  namespaces - and nothing more - which is what this template grants.
  Nothing is rendered when secretCache.namespaces is empty, so the default
  chart permissions are unchanged.
*/}}
{{- with .Values.secretCache.namespaces }}
{{- range . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" $ }}-secret-cache
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: k8sgpt-operator
    app.kubernetes.io/part-of: k8sgpt-operator
  {{- include "chart.labels" $ | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" $ }}-secret-cache
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: k8sgpt-operator
    app.kubernetes.io/part-of: k8sgpt-operator
  {{- include "chart.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.fullname" $ }}-secret-cache
subjects:
- kind: ServiceAccount
  name: {{ include "chart.fullname" $ }}-controller-manager
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
