apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-deepseek-auto-remediation
spec:
  ai:
    autoRemediation:
      enabled: true
      similarityRequirement: "90"
      resources:
        - Pod
        - Deployment
    enabled: true
    # DeepSeek is routed through K8sGPT's OpenAI-compatible client.
    backend: deepseek
    model: deepseek-v4-flash
    secret:
      name: k8sgpt-deepseek-secret
      key: api-key
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.1
