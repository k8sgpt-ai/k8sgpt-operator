name: Verify metrics relationships

on:
  pull_request:
    branches: [main]
    paths:
      - ".iac-guard-v/**"
      - ".github/workflows/iac-contract.yaml"
      - "config/default/**"
      - "config/manager/**"
      - "config/prometheus/**"
      - "config/rbac/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: "v1.36.1"

      - name: Install IaC-Guard-V
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --only-binary=:all: \
            iac-guard-v==0.1.0b1

      - name: Render the generated manifests deterministically
        run: |
          mkdir -p "${RUNNER_TEMP}/render-first" "${RUNNER_TEMP}/render-second"
          kubectl kustomize config/default > "${RUNNER_TEMP}/render-first/objects.yaml"
          kubectl kustomize config/default > "${RUNNER_TEMP}/render-second/objects.yaml"
          cmp "${RUNNER_TEMP}/render-first/objects.yaml" \
            "${RUNNER_TEMP}/render-second/objects.yaml"

      - name: Verify the metrics scrape path
        run: |
          iac-guard contract lint \
            --contract .iac-guard-v/contracts.yaml \
            --format console
          iac-guard contract plan \
            --contract .iac-guard-v/contracts.yaml \
            --project-root . \
            --contract-root "${RUNNER_TEMP}/render-first" \
            --contract-provenance SUGGESTED_CONTRACT \
            --source-commit "${GITHUB_SHA}" \
            --default-namespace default \
            --format console

          set +e
          iac-guard verify \
            --contract .iac-guard-v/contracts.yaml \
            --project-root . \
            --contract-root "${RUNNER_TEMP}/render-first" \
            --contract-provenance SUGGESTED_CONTRACT \
            --source-commit "${GITHUB_SHA}" \
            --default-namespace default \
            --format json \
            --output "${RUNNER_TEMP}/iac-contract-report.json" \
            --quiet
          verify_status=$?
          set -e

          iac-guard explain "${RUNNER_TEMP}/iac-contract-report.json" \
            --format console
          exit "${verify_status}"
